<header class="main-navbar">
      <div class="nav-container">
        
        <div class="nav-brand">
          <span class="brand-icon">📦</span>
          <h1>Warehouse Management System</h1>
        </div>
        
        <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()">
          @if (isMenuOpen()) {
            ✕
          } @else {
            ☰
          }
        </button>
        
        <nav class="nav-links" [class.menu-active]="isMenuOpen()">
          <a routerLink="/products" routerLinkActive="active-link" (click)="closeMenu()">
            📁 Products
          </a>
          <a routerLink="/barcode-scan" routerLinkActive="active-link" (click)="closeMenu()">
            🔍 Scan Barcode
          </a>
          <a routerLink="/stock-movements" routerLinkActive="active-link" (click)="closeMenu()">
            🔄 Stock Movements
          </a>
          <a routerLink="/low-stock-dashboard" routerLinkActive="active-link" (click)="closeMenu()">
            ⚠️ Low Stock Alerts
          </a>
        </nav>

      </div>
    </header>

    @if (isMenuOpen()) {
      <div class="menu-overlay" (click)="closeMenu()"></div>
    }

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
    
    <app-toast />
