<div class="page-header">
      <h2>Warehouse Inventory Stock Management</h2>
    </div>

    <div class="filter-container" style="margin-bottom: 1.5rem;">
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label style="margin-bottom: 0.5rem; font-weight: 500; color: var(--text-muted);">
          Select Target Warehouse Product Workspace:
        </label>
        <select class="category-select" (change)="onProductSelect($event)">
          <option value="">-- Choose inventory item to audit --</option>
          @for (p of catalogStore.products(); track p.id) {
            <option [value]="p.id">{{ p.name }} (SKU: {{ p.sku }}) - Stock: {{ p.currentStock }}</option>
          }
        </select>
      </div>
    </div>

    @if (stockStore.error()) {
      <div class="error-banner" style="background: var(--danger-bg); color: var(--danger); padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
        {{ stockStore.error() }}
      </div>
    }

    @if (activeProduct()) {
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        
        <app-movement-form 
          [selectedProduct]="activeProduct()"
          (submitMovement)="onPostMovement($event)"
        />

        @if (stockStore.loading()) {
          <div class="loading-spinner">Syncing transactional logs...</div>
        } @else {
          <h3 style="margin-top: 1rem;">Transaction Audit Trail Log Ledger</h3>
          <app-movement-history [history]="stockStore.history()" />
        }

      </div>
    }
