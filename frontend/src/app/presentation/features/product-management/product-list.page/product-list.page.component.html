<div class="page-header">
      <h2>Management Warehouse</h2>
      @if (!isFormOpen()) {
        <button class="btn-primary" (click)="openCreateForm()">+ New Product</button>
      }
    </div>

    @if (isFormOpen()) {
      <app-product-form 
        [productToEdit]="selectedProduct()"
        (save)="onSaveProduct($event)"
        (cancel)="closeForm()"
      />
    }

    <app-product-filters 
      [initialFilters]="store.filters()"
      (filterChange)="store.updateFilters($event)"
    />

    @if (store.loading()) {
      <div class="loading-spinner">Processing...</div>
    } @else {
      <app-product-table 
        [products]="store.products()"
        [totalCount]="store.totalCount()"
        [currentPage]="store.filters().page"
        [pageSize]="store.filters().pageSize"
        (pageChange)="onPageChange($event)"
        (edit)="onEditProduct($event)"
        (delete)="onOpenDeleteModal($event)"
      />
    }

    <app-confirm-modal 
      [isOpen]="isDeleteModalOpen()"
      title="Delete Product"
      message="Are you sure you want to delete this product?"
      (confirm)="onConfirmDelete()"
      (cancel)="isDeleteModalOpen.set(false)"
    />
