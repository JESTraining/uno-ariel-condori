<div class="form-card">
      <h3>{{ isEditMode() ? 'Edit Product' : 'New Product' }}</h3>
      
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Product Name</label>
          <input formControlName="name" type="text" />
        </div>

        <div class="form-group">
          <label>Barcode (Optional)</label>
          <input formControlName="barcode" type="text" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categoryId">Category</label>
            <select id="categoryId" formControlName="category">
              <option value="">-- Select Category --</option>
              @for (cat of categories(); track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="locationId">Warehouse Location</label>
            <select id="locationId" formControlName="location">
              <option value="">-- Select location --</option>
              @for (loc of locations(); track loc.id) {
                <option [value]="loc.id">{{ loc.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>SKU</label>
          <input formControlName="sku" type="text" [attr.disabled]="isEditMode() ? true : null" />
          @if (productForm.controls.sku.touched && productForm.controls.sku.invalid) {
            <span class="error">SKU is required.</span>
          }
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Price</label>
            <input formControlName="price" type="number" step="0.01" />
          </div>
          <div class="form-group">
            <label>Reorder Threshold (Alerts)</label>
            <input formControlName="reorderThreshold" type="number" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancel.emit()">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="productForm.invalid">
            {{ isEditMode() ? 'Save Changes' : 'Create Product' }}
          </button>
        </div>
      </form>
    </div>
